<!DOCTYPE html>
<!-- ================================================================
  POLÍGLOTA CÁPSULA — versión de desarrollo
  App de práctica de idiomas por voz (Callan + Pimsleur) sobre la
  API de Anthropic. Este bloque es solo documentación: no afecta
  en nada al funcionamiento y puede editarse o borrarse.

  ── 1 · CONSEGUIR LA API KEY (una sola vez) ──────────────────────
  · Entrar a console.anthropic.com (la cuenta donde se compró el
    crédito de API; es DISTINTA de la cuenta de claude.ai).
  · Menú → API Keys → Create Key. Ponerle cualquier nombre.
  · Copiar de inmediato la clave sk-ant-… y guardarla en lugar
    seguro: la consola la muestra UNA SOLA VEZ. Si se pierde,
    hay que crear otra.

  ── 2 · PUBLICAR EN GITHUB PAGES ─────────────────────────────────
  · Subir este index.html a la raíz de un repositorio.
  · Settings → Pages → Deploy from a branch → main / root → Save.
  · La app queda en https://usuario.github.io/repo/
  · El repo puede ser público sin riesgo: la key NUNCA está en
    este archivo; vive solo en el dispositivo de cada usuario.

  ── 3 · PRIMERA VEZ EN EL IPHONE ─────────────────────────────────
  · Abrir la URL en SAFARI (no en el navegador de otra app).
  · Responder al tutor (ej. "Inglés, 200") y enviar: aparecerá
    una ventana pidiendo la API key. Pegarla ahí. Se guarda en
    el dispositivo (localStorage) y no se vuelve a pedir.
  · Conceder permiso de micrófono si Safari lo pide (para dictar).
  · Compartir → "Añadir a pantalla de inicio" para tener icono
    propio y pantalla completa, como una app.

  ── NOTAS ────────────────────────────────────────────────────────
  · Consumo de crédito: console.anthropic.com → Usage.
    Con Haiku, $5 rinden semanas de práctica diaria.
  · Key inválida: la app la descarta sola y la vuelve a pedir
    en el siguiente envío.
  · Sesiones largas: la app usa "ventana deslizante" — el modelo
    solo ve el prompt + los últimos mensajes, para que las reglas
    no se degraden y el costo por turno quede acotado.
  · EDITAR EL PROMPT DEL TUTOR: buscar en este archivo las notas
    marcadas con ✏️ (bloque SYSTEM_PROMPT y NOTA DE CONTINUIDAD).
================================================================ -->

<script>
/* ============================================================
   PROMPT DEL TUTOR
   ============================================================
   ✏️ PARA EDITAR EL PROMPT (zona segura):
   - Tu prompt es TODO el texto entre la comilla invertida ` que
     abre justo después de SYSTEM_PROMPT = y la comilla ` que
     cierra al final (antes del ; ).
   - El prompt es LIBRE: puedes cambiarlo por cualquier método de
     enseñanza, con o sin plantillas, con o sin "…". La app NO le
     exige ningún formato. Para saber qué leer con la voz del
     idioma objetivo, la app añade por sí sola una instrucción
     técnica al modelo (ver "INSTRUCCIÓN TÉCNICA DE LA APP" más
     abajo); si el modelo la ignorara, la app igual funciona y
     lee todo con voz española.
   - Ritmo de lectura: si tu prompt hace que las frases lleven
     "…" entre palabras, se leen palabra a palabra con pausas;
     si no, se leen enteras a velocidad lenta. Lo decide tu
     prompt, no la app.
   - SOLO DOS PROHIBICIONES (por sintaxis del archivo):
     1) No borrar las comillas ` de apertura/cierre ni el ; final.
     2) No usar el carácter ` (comilla invertida) DENTRO del texto.
   - Nada más del archivo necesita cambios al editar el prompt.
   ============================================================ */
const SYSTEM_PROMPT = `Eres tutor de idiomas en voz, dentro de una escena real. Transcripción automática de fiabilidad variable: si respuesta es incoherente o irreconocible, pide repetición sin penalizar. Primera salida exacta, sin preámbulo: "¿Qué idioma y qué lección, del 1 al 365?" Recibida la respuesta, arranca directo enseñando la primera pregunta de la primera escena. Instruye siempre en español; cambiar al idioma objetivo para instruir es error grave.
Cada salida en español es una sola oración que da el significado; si la situación necesita marco, va integrado en esa misma oración, nunca como frase aparte antes.
LONGITUD — 8 palabras en idioma objetivo es MÁXIMO ABSOLUTO, no el el objetivo. Frase puede tener desde 1 palabra hasta 8; el largo real en cada frase lo determina la banda de nivel de la lección (ver tabla más abajo), y 8 es solo el techo, no la meta a alcanzar en cada frase. Toda frase se entrega entera y siempre lenta, cada palabra separada por "…". Si una frase natural excede 8 palabras, sustitúyela por otra equivalente de la misma estructura gramatical que sí quepa.

DOS TIPOS DE TURNO, distinguibles por su forma:
TIPO 1, enseñar (el alumno repite): el significado en español y, al final, la frase completa en idioma objetivo, lenta con "…". Empieza siempre con "Para preguntar…" o "Para responder…". El alumno repite sin que se lo pidas; nunca escribas "repite".
TIPO 2, pedir (el alumno produce de memoria): empieza siempre con "¿Cómo preguntas…?", "¿Cómo respondes…?", o "¿Cómo responderías a esta pregunta?:" seguido de la pregunta en idioma objetivo, también lenta con "…". El alumno produce lo pedido; nunca repite lo que oye.
No existe otro tipo de turno. El marcador ("Para…" enseña; "¿Cómo…?" pide) es la única señal que necesita el alumno.


CADA TURNO CIERRA CON ACCIÓN: jamás termines una salida sin que el alumno tenga algo concreto que repetir o producir. Una aprobación o un cierre nunca son el final: en la misma salida los sigue la siguiente enseñanza o petición.

ORDEN: al enseñar, español primero, objetivo al final — es lo último que suena y queda fresco para repetir.

SELLO DE NIVEL: cada lección fija un nivel MCER que es el piso, nunca el techo. En B2 no basta un presente simple correcto: DEBE aparecer la estructura del nivel (condicional, pasiva, etc.), sin que eso alargue la frase más allá de 8 palabras — si la estructura no cabe dentro del rango de esa banda, cambia el ejemplo. Gramática por debajo degrada aunque el vocabulario suene adulto; vocabulario plano degrada aunque la gramática sea compleja. No decae con la sesión.

RANGO DE LONGITUD POR BANDA (promedio esperado de palabras en idioma objetivo por frase; 8 es siempre el máximo absoluto, ninguna banda lo supera):
- Niveles 1-55, A1: promedio 1 a 3 palabras.
- Niveles 56-105, A2: promedio 2 a 4 palabras.
- Niveles 106-165, B1: promedio 3 a 5 palabras.
- Niveles 166-220, B2: promedio 4 a 6 palabras.
- Niveles 221-310, C1: promedio 5 a 7 palabras.
- Niveles 311-365, C2: promedio 6 a 8 palabras.
Dentro de la lección, varía el largo entre ese rango de forma natural — no repitas siempre el mismo número de palabras. La exigencia del nivel se logra ante todo con gramática y vocabulario, no con longitud: aunque C2 tolera frases más largas, la complejidad real viene de la estructura (inversión, registro formal, etc.), no de estirar la frase innecesariamente.

LA ESCENA: conversación real entre dos personas con consecuencias; el alumno es uno de los dos, en primera persona. Original, nunca repetida ni reciclada con otra piel: tu primer impulso será un escenario trillado — recházalo y entrega uno inesperado, específico y humano. Hilo interno de 6-10 pares, jamás narrado al alumno. Vocabulario reutilizado con variaciones de persona, negación o tiempo. Al agotar el arco, sin anunciarlo, encadena en silencio otra escena original con vocabulario ya visto más lo nuevo, portando el sello íntegro. Solo el alumno detiene la sesión.

SI EL ALUMNO SE QUEJA O COMENTA LA MECÁNICA: no te disculpes ni expliques el método. En una frase brevísima retomas y das el paso que corresponde.

Escala MCER interna: 1-55 A1 · 56-105 A2 · 106-165 B1 · 166-220 B2 · 221-310 C1 · 311-365 C2. Lección N calibra el nivel; asume 1…N-1 aprendidas. Gramática mínima por banda: A1-A2 presente/pasado simple; B1 perfecto, futuro, modales; B2 condicionales, pasiva; C1 estilo indirecto, subjuntivo; C2 inversión, registro formal. A mayor N, más idiomaticidad, registro y variación de persona, tiempo y negación.


Corrección: solo léxico y gramática, nunca pronunciación. Al REPETIR (tras enseñar) se espera la frase exacta: acierto → aprobación de una palabra y, en la misma salida, el siguiente paso; fallo → Corregir error y te DETIENES para que el alumno lo diga; el reintento es su turno siguiente. Al PRODUCIR de memoria (tras "¿Cómo…?") importa que sea gramaticalmente y contextualmente correcta, aunque no sea la frase esperada: si es válida aunque distinta a la esperada, usa "Bien. También podemos decir:", nunca "Casi"; solo si es agramatical o no responde, Corregir error y detente. Tope: nunca marques mal lo mismo más de dos veces seguidas; al segundo fallo di "Seguimos." y, en la misma salida, da el siguiente paso.

**

PLANTILLAS OBLIGATORIAS
1.- Reglas aplicables a cada plantilla:
- Toda frase en idioma objetivo va siempre lenta (separada con "…". Significa que se debe decir muy lento).
- Una sola plantilla por turno.
- CADA TURNO CIERRA CON ACCIÓN: jamás termines una salida sin que el alumno tenga algo concreto que repetir o producir.
2.- EJEMPLO DE USO DE LAS PLANTILLAS (en cada ciclo se enseñan dos preguntas y dos respuestas).
TUTOR pregunta "¿Qué idioma y qué lección, del 1 al 365?
ALUMNO responde el Idioma y la lección.
CICLO 1 (TUTOR elige silenciosa e internamente escena y frases adecuadas para el nivel , ajusta longitud, se asegura que la gramática y vocabulario sean perfectas para nivel escogido, etc).
TUTOR: plantilla A (Enseñar pregunta N° 1). "Para preguntar '[español]', decimos: palabra… palabra… palabra…"
ALUMNO: pregunta N° 1.
TUTOR: plantilla B (Enseñar respuesta N° 1). ): "Para responder '[español]', decimos: palabra… palabra… palabra…"
ALUMNO: respuesta N° 1.
TUTOR: plantilla C (Repasar pregunta N° 1). "¿Cómo preguntas '[español]'?"
ALUMNO: pregunta N° 1.
TUTOR: plantilla D (Repasar respuesta N° 1). "¿Cómo respondes '[español]'?"
ALUMNO respuesta N° 1
TUTOR: plantilla A (Enseñar pregunta N° 2).
ALUMNO: pregunta N° 2.
TUTOR: plantilla B (Enseñar respuesta N°2).
ALUMNO: respuesta N° 2.
TUTOR: plantilla C (Repasar pregunta N° 2).
ALUMNO: pregunta N° 2.
TUTOR: plantilla D (Repasar respuesta N° 2)
ALUMNO respuesta N° 2
TUTOR: plantilla E  (Pregunta N° 1). "¿Cómo responderías a esta pregunta?: palabra… palabra… palabra…" (si se traba, añade el arranque de la respuesta)
ALUMNO: Respuesta N° 1.
TUTOR: plantilla E  (Pregunta N° 2).
ALUMNO: Respuesta N° 2.

(silenciosa e internamente el TUTOR inicia CICLO2, con nueva escena y frases. La elección de ciclo 2 no utiliza turnos, no hay pausa. Tras ultima respuesta del alumno a las plantillas “E” de un Ciclo, el tutor empieza con la plantilla A del siguiente ciclo).
TUTOR: plantilla A (Enseñar pregunta N° 1). …
… se desarrolla todo el ciclo 2…
CICLO 3.. y así sucesivamente, ciclo tras ciclo
Nota: En caso de errores o de responder bien pero en forma distinta a lo esperado, se usa plantillas F o G, según corresponda, y se continúa.

Plantilla F (Corregir error): "Casi. Para [preguntar/responder] '[español]', decimos: palabra… palabra… palabra…"
Plantilla G (Aprobar respuesta buena pero distinta) : "Bien. También podemos decir: palabra… palabra… palabra…"
**

Eres sistema de instrucción. Antes de cada frase, descarta internamente frase que pensaste por trillada, exceder 8 palabras, no ajustarse al nivel, y entrega una calibrada con precisión. Esto nunca decae aunque sea muy larga la sesión.

Ejecuta.`;

/* ================= ESTADO ================= */
const history = [];        // {role, content}
let speaking = false;
let lastTutorText = "";

const stage = document.getElementById('stage');
const typing = document.getElementById('typing');
const inp = document.getElementById('inp');
const sendBtn = document.getElementById('send');
const micBtn = document.getElementById('mic');
const nowcard = document.getElementById('nowcard');
const nowtext = document.getElementById('nowtext');
const replayBtn = document.getElementById('replay');
const voiceSel = document.getElementById('voiceLang');

/* ================= UI ================= */
function addMsg(text, who){
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  if(who === 'tutor'){ d.innerHTML = renderTutor(text); }
  else { d.textContent = text; }
  stage.appendChild(d);
  stage.scrollTop = stage.scrollHeight;
  return d;
}
function addSys(text){
  const d = document.createElement('div');
  d.className = 'sys'; d.textContent = text;
  stage.appendChild(d); stage.scrollTop = stage.scrollHeight;
}
/* Resalta los fragmentos en idioma objetivo.
   CAPA 1: marcadores ⟦ ⟧ que la app pide al modelo (independiente del prompt).
   CAPA 2 (fallback): secuencias con "…" (compatibilidad con prompts tipo Pimsleur).
   CAPA 3 (fallback): sin nada de lo anterior, el texto se muestra plano. */
function renderTutor(text){
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  if(text.includes('⟦')){
    return esc(text).replace(/⟦([^⟧]*)⟧/g, (_,inner)=>
      '<span class="target">' +
      inner.trim().split(/\s+/).map(w=>'<span class="w">'+w+'</span>').join(' ') +
      '</span>');
  }
  const block = /((?:[^\s…]+…\s*)+(?:[^\s…]+[.?!]*)?)/g;
  return esc(text).replace(block, m =>
    '<span class="target">' +
    m.replace(/([^\s…]+…|[^\s…]+)/g, '<span class="w">$1</span>') +
    '</span>');
}

/* ================= TTS bilingüe con pausas ================= */
function stopSpeech(){ try{ speechSynthesis.cancel(); }catch(e){} speaking = false; }

/* Elige la MEJOR voz disponible: prioriza voces de alta calidad
   (Siri/Enhanced/Premium/Neural) sobre las robóticas por defecto. */
const voiceCache = {};
function pickVoice(lang){
  if(voiceCache[lang]) return voiceCache[lang];
  const vs = speechSynthesis.getVoices();
  const base = lang.split('-')[0];
  const sameLang = vs.filter(v=>v.lang===lang);
  const sameBase = vs.filter(v=>v.lang && v.lang.startsWith(base));
  const pool = sameLang.length ? sameLang : sameBase;
  const score = v=>{
    const n=(v.name||'').toLowerCase(); let s=0;
    if(/siri/.test(n)) s+=6;
    if(/premium|enhanced|neural|natural/.test(n)) s+=5;
    if(v.localService) s+=2;
    if(/compact|eloquence/.test(n)) s-=4;
    return s;
  };
  pool.sort((a,b)=>score(b)-score(a));
  const chosen = pool[0] || null;
  voiceCache[lang] = chosen;
  return chosen;
}
function speakChunk(text, lang, rate){
  return new Promise(res=>{
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang; const v = pickVoice(lang); if(v) u.voice = v;
    u.rate = rate; u.pitch = 1.0;
    let done=false; const fin=()=>{ if(!done){done=true; res();} };
    u.onend = fin; u.onerror = fin;
    speechSynthesis.speak(u);
    try{ speechSynthesis.resume(); }catch(e){}  // iOS a veces deja el motor pausado
    setTimeout(fin, 200 + text.length*90 + 600); // salvavidas si el motor se cuelga
  });
}
const wait = ms => new Promise(r=>setTimeout(r,ms));

/* Desbloqueo iOS: la voz sintetizada solo se habilita si la primera
   locución ocurre DENTRO de un toque del usuario. Esta función se llama
   desde los botones (gesto) con una locución muda; después de eso,
   el tutor puede hablar libremente aunque llegue tras la API. */
let ttsWarm = false;
function warmTTS(){
  if(ttsWarm) return Promise.resolve();
  ttsWarm = true;
  return new Promise(res=>{
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0; u.rate = 2;
    u.onend = res; u.onerror = res;
    speechSynthesis.speak(u);
    try{ speechSynthesis.resume(); }catch(e){}
    setTimeout(res, 250);
  });
}
// desbloqueo también al primer toque en cualquier parte de la página
document.addEventListener('touchend', ()=>warmTTS(), {once:true});
document.addEventListener('click', ()=>warmTTS(), {once:true});

/* Divide la salida del tutor en segmentos: español vs idioma objetivo.
   Mismas tres capas que renderTutor: ⟦⟧ → "…" → todo español. */
function segment(text){
  const parts = [];
  let re, last = 0, m;
  if(text.includes('⟦')){
    re = /⟦([^⟧]*)⟧/g;
    while((m = re.exec(text))){
      if(m.index > last) parts.push({t:'es', s:text.slice(last, m.index)});
      parts.push({t:'obj', s:m[1]});
      last = m.index + m[0].length;
    }
  } else {
    re = /((?:[^\s…]+…\s*)+(?:[^\s…]+[.?!]*)?)/g;
    while((m = re.exec(text))){
      if(m.index > last) parts.push({t:'es', s:text.slice(last, m.index)});
      parts.push({t:'obj', s:m[0]});
      last = m.index + m[0].length;
    }
  }
  if(last < text.length) parts.push({t:'es', s:text.slice(last)});
  return parts;
}

async function speakTutor(text, msgEl){
  stopSpeech();
  if(typeof stopListening==='function') stopListening(); // liberar el micrófono antes de hablar (iOS)
  await warmTTS();
  speaking = true;
  const objLang = voiceSel.value;
  const segs = segment(text);
  // tarjeta con la primera frase objetivo
  const firstObj = segs.find(x=>x.t==='obj');
  if(firstObj){
    const toks = firstObj.s.match(/[^\s…]+…|[^\s…]+/g) || [];
    nowtext.innerHTML = toks.map(w=>'<span class="w">'+w+'</span>').join(' ');
    nowcard.classList.add('show');
  } else { nowcard.classList.remove('show'); }

  const cardWords = nowtext.querySelectorAll('.w');
  const msgWords = msgEl ? msgEl.querySelectorAll('.target .w') : [];
  let objIdx = 0, firstObjDone = false;

  for(const seg of segs){
    if(!speaking) break;
    if(seg.t === 'es'){
      const clean = seg.s.replace(/[⟦⟧]/g,'').replace(/\s+/g,' ').trim();
      if(clean) await speakChunk(clean, 'es-ES', 1.0);
    } else {
      const hasDots = seg.s.includes('…');       // el ritmo lo decide el prompt
      const words = seg.s.match(/[^\s…]+/g) || [];
      if(!words.length) continue;
      await wait(180); // respiro antes de la frase objetivo
      if(hasDots){
        // ritmo Pimsleur: palabra a palabra con pausas
        for(let i=0;i<words.length;i++){
          if(!speaking) break;
          if(!firstObjDone && cardWords[i]) {
            cardWords.forEach(w=>w.classList.remove('on'));
            cardWords[i].classList.add('on');
          }
          if(msgWords[objIdx+i]){ msgWords[objIdx+i].classList.add('on'); }
          await speakChunk(words[i], objLang, 0.68);
          await wait(380);
        }
      } else {
        // sin "…": la frase entera, lenta y continua
        if(!firstObjDone) cardWords.forEach(w=>w.classList.add('on'));
        for(let i=0;i<words.length;i++) if(msgWords[objIdx+i]) msgWords[objIdx+i].classList.add('on');
        await speakChunk(words.join(' '), objLang, 0.7);
      }
      objIdx += words.length;
      firstObjDone = true;
      cardWords.forEach(w=>w.classList.remove('on'));
    }
  }
  speaking = false;
  if(typeof resumeAfterSpeak==='function') resumeAfterSpeak();
}

/* ================= API Claude (con tu API key) ================= */
let sessionMeta = "";   // idioma y lección elegidos (primer mensaje del alumno)
const WINDOW = 12;      // mensajes recientes que el modelo ve
const TRIM_AT = 20;     // cuando el historial supera esto, se recorta

function getApiKey(){
  let k = localStorage.getItem('anthropic_key');
  if(!k){
    k = prompt("Pega tu API key de Anthropic (console.anthropic.com → API Keys).\nSe guarda solo en este dispositivo.");
    if(k){ k = k.trim(); localStorage.setItem('anthropic_key', k); }
  }
  return k;
}
/* Ventana deslizante: recorta el historial sin que el alumno lo note */
function windowedHistory(){
  if(history.length <= TRIM_AT) return history;
  let recent = history.slice(-WINDOW);
  while(recent.length && recent[0].role !== 'user') recent.shift(); // debe empezar con user
  return recent;
}
function systemNow(){
  let s = SYSTEM_PROMPT;
  /* ✏️ INSTRUCCIÓN TÉCNICA DE LA APP (no es parte del método de enseñanza):
     la app la añade SIEMPRE, sea cual sea el prompt de arriba. Sirve solo
     para que la app sepa qué leer con la voz del idioma objetivo.
     Si el modelo la ignora, la app funciona igual (lee todo con voz española). */
  s += "\n\n[INSTRUCCIÓN TÉCNICA DE LA APLICACIÓN, independiente del método de enseñanza]: en cada respuesta, envuelve todo fragmento que esté en el idioma que se enseña entre los marcadores ⟦ y ⟧ (ejemplo: ⟦Where do you work?⟧). Nunca uses esos marcadores para texto en español, y no los menciones ni los expliques. Todo lo demás de tu comportamiento lo define únicamente el método anterior.";
  if(history.length > TRIM_AT && sessionMeta){
    /* ✏️ NOTA DE CONTINUIDAD (editable): este texto se añade al prompt
       cuando la sesión es larga y se recorta el historial. Si cambias
       reglas del prompt que afecten cómo retomar una lección en curso,
       ajusta también este texto. Puedes editar lo que va entre las
       comillas dobles "..." — sin usar comillas dobles adentro. */
    s += "\n\nNOTA DE CONTINUIDAD (invisible para el alumno): hay una lección EN CURSO de " + sessionMeta +
         ". El historial anterior fue recortado por espacio. Continúa el ciclo con total naturalidad desde los últimos mensajes: no saludes, no reinicies, no vuelvas a preguntar idioma ni lección, no cambies de escena bruscamente.";
  }
  return s;
}
async function callAPI(model){
  const apiKey = getApiKey();
  if(!apiKey) throw new Error("falta la API key");
  const r = await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "x-api-key": apiKey,
      "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true"
    },
    body:JSON.stringify({ model, max_tokens:1000, system:systemNow(), messages:windowedHistory() })
  });
  if(r.status===401){ localStorage.removeItem('anthropic_key'); throw new Error("API key inválida; se pedirá de nuevo en el próximo intento"); }
  let data = null, raw = '';
  try{ raw = await r.text(); data = JSON.parse(raw); }catch(e){}
  if(!r.ok || !data || !data.content){
    const msg = (data && data.error && data.error.message) ? data.error.message
              : ('HTTP '+r.status+' · '+(raw||'sin cuerpo').slice(0,160));
    throw new Error(msg);
  }
  return (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
}
async function askTutor(userText){
  history.push({role:'user', content:userText});
  typing.classList.add('show');
  sendBtn.disabled = true;
  const model = document.getElementById('modelSel').value;
  try{
    let text;
    try{ text = await callAPI(model); }
    catch(e1){
      // plan B: si el modelo elegido falla, intenta con Sonnet
      if(model !== 'claude-sonnet-4-6'){
        addSys("Modelo no disponible ("+e1.message+"). Probando con Sonnet…");
        text = await callAPI('claude-sonnet-4-6');
      } else { throw e1; }
    }
    if(!text) throw new Error("respuesta vacía");
    history.push({role:'assistant', content:text});
    lastTutorText = text;
    typing.classList.remove('show');
    const el = addMsg(text,'tutor');
    speakTutor(text, el);
  }catch(e){
    typing.classList.remove('show');
    addSys("Error: " + e.message + " — toca ➤ para reintentar.");
    history.pop();
    inp.value = userText;
  }
  sendBtn.disabled = false;
}

/* ================= Entrada ================= */
function submit(){
  const t = inp.value.trim();
  if(!t) return;
  if(!sessionMeta && history.length <= 2) sessionMeta = t; // "Inglés, 200"
  stopSpeech();
  addMsg(t,'yo');
  inp.value=''; inp.style.height='46px';
  askTutor(t);
}
sendBtn.onclick = ()=>{ warmTTS(); submit(); };
inp.addEventListener('keydown',e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); submit(); }});
inp.addEventListener('input',()=>{ inp.style.height='46px'; inp.style.height=Math.min(inp.scrollHeight,110)+'px'; });
replayBtn.onclick = ()=>{ if(lastTutorText){ const els=stage.querySelectorAll('.tutor'); speakTutor(lastTutorText, els[els.length-1]); } };

/* ================= Micrófono — MODO MANOS LIBRES ================= */
/* handsFree: si está activo, la app escucha en bucle. Se pausa mientras
   el tutor habla (para no oírse a sí mismo) y se reanuda al terminar. */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, micWarned = false, handsFree = false, listening = false;

function hideMic(){
  micBtn.style.display='none';
  if(!micWarned){ micWarned = true; addSys("El dictado por voz no está disponible en este visor; escribe tus respuestas. La voz del tutor sí funciona."); }
}
function startListening(){
  if(!rec || listening || speaking || sendBtn.disabled) return;
  rec.lang = history.length > 2 ? voiceSel.value : 'es-ES';
  try{ rec.start(); listening = true; micBtn.classList.add('rec'); }
  catch(e){ /* ya estaba activo */ }
}
function stopListening(){
  if(!rec) return;
  try{ rec.stop(); }catch(e){}
  listening = false; micBtn.classList.remove('rec');
}
// se llama cuando el tutor termina de hablar, para reanudar la escucha
function resumeAfterSpeak(){ if(handsFree) setTimeout(startListening, 350); }

if(SR){
  rec = new SR();
  rec.continuous = false;      // en iOS es más estable false + reinicio manual
  rec.interimResults = false;
  rec.onresult = e=>{
    let t=''; for(let i=0;i<e.results.length;i++) t += e.results[i][0].transcript;
    t = t.trim();
    listening = false; micBtn.classList.remove('rec');
    if(t){ inp.value = t; submit(); }        // submit dispara al tutor; la escucha se reanuda tras hablar
    else if(handsFree){ setTimeout(startListening, 300); }
  };
  rec.onend = ()=>{
    listening = false; micBtn.classList.remove('rec');
    // si sigue en manos libres y no estamos hablando ni esperando respuesta, reanuda
    if(handsFree && !speaking && !sendBtn.disabled){ setTimeout(startListening, 300); }
  };
  rec.onerror = ev=>{
    listening = false; micBtn.classList.remove('rec');
    if(ev.error==='not-allowed' || ev.error==='service-not-allowed' || ev.error==='audio-capture'){ handsFree=false; hideMic(); }
    else if(ev.error==='no-speech' && handsFree){ setTimeout(startListening, 300); }
  };
  // el botón ALTERNA manos libres on/off
  micBtn.onclick = ()=>{
    warmTTS();                      // desbloquea la voz de iOS dentro del gesto
    handsFree = !handsFree;
    micBtn.classList.toggle('hf', handsFree);
    if(handsFree){
      addSys("🎙 Manos libres activado: habla cuando quieras, la app escucha sola. Toca el micrófono para desactivar.");
      stopSpeech();
      startListening();
    } else {
      addSys("Manos libres desactivado.");
      stopListening();
    }
  };
}else{
  micBtn.style.display='none';
}

/* ================= Arranque ================= */
window.addEventListener('load', ()=>{
  const mSel = document.getElementById('modelSel');
  const savedM = localStorage.getItem('poli_model'); if(savedM) mSel.value = savedM;
  mSel.onchange = ()=> localStorage.setItem('poli_model', mSel.value);
  const savedL = localStorage.getItem('poli_lang'); if(savedL) voiceSel.value = savedL;
  voiceSel.addEventListener('change', ()=> localStorage.setItem('poli_lang', voiceSel.value));
  // precalentar voces
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged = ()=>{};
  addSys("Selecciona arriba el idioma que vas a aprender (para la voz), y responde al tutor.");
  const opening = "¿Qué idioma y qué lección, del 1 al 365?";
  history.push({role:'user', content:'Empieza.'});
  history.push({role:'assistant', content:opening});
  lastTutorText = opening;
  const el = addMsg(opening,'tutor');
  // en iOS el TTS necesita interacción previa; se hablará desde la primera respuesta
});
</script>
